{% extends 'agency/base.html' %}

{% block title %}{{ action }} путевку — Глобус Тревел{% endblock %}
{% block body_class %}page--tour-form{% endblock %}

{% block content %}
<div class="form-narrow form-card">
    <h1>{{ action }} путевку</h1>
    <form method="post" class="tour-form">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="btn-row">
            <button type="submit" class="btn">{{ action }}</button>
            <a href="{% url 'tour_list' %}" class="btn btn--light">Отмена</a>
        </div>
    </form>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var dateInput = document.querySelector('input[name="departure_date"]');
            if (dateInput) {
                var today = new Date().toISOString().split('T')[0];
                dateInput.setAttribute('min', today);
                dateInput.setAttribute('title', 'Дата вылета не может быть в прошлом');
            }
        });
    </script>
</div>
{% endblock %}
