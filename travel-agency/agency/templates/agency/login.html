{% extends 'agency/base.html' %}

{% block title %}Вход — Глобус Тревел{% endblock %}
{% block body_class %}page--auth{% endblock %}

{% block content %}
<div class="form-narrow form-card">
    <h1>Вход в систему</h1>
    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn--block">Войти</button>
    </form>
    <p class="auth-switch">
        Ещё нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a>
    </p>
</div>
{% endblock %}
