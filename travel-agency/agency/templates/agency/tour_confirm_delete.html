{% extends 'agency/base.html' %}

{% block title %}Удаление путевки — Глобус Тревел{% endblock %}
{% block body_class %}page--tour-delete{% endblock %}

{% block content %}
<div class="form-narrow form-card center">
    <h2>Вы уверены, что хотите удалить путевку?</h2>
    <p class="muted">
        Будет удалена путевка: <strong>"{{ tour.title }}"</strong>
    </p>
    <form method="post" class="btn-row btn-row--center">
        {% csrf_token %}
        <button type="submit" class="btn btn--danger">Да, удалить</button>
        <a href="{% url 'tour_list' %}" class="btn btn--light">Отмена</a>
    </form>
</div>
{% endblock %}
