<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90">
  <!-- Рамка сертификата для border-image: срез 30px (углы 30x30, края повторяются) -->
  <rect width="90" height="90" fill="#fffaf0"/>
  <rect x="3" y="3" width="84" height="84" fill="none" stroke="#0d3b6e" stroke-width="4"/>
  <rect x="10" y="10" width="70" height="70" fill="none" stroke="#c8102e" stroke-width="1.5"/>
  <rect x="14" y="14" width="62" height="62" fill="none" stroke="#2b9bd8" stroke-width="1" stroke-dasharray="3 2"/>
  <!-- узор на краях: ромбы по центру каждой стороны (повторяются при border-image-repeat: round) -->
  <g fill="#d4a017">
    <path d="M45 18 l4 4 -4 4 -4 -4z"/>
    <path d="M45 64 l4 4 -4 4 -4 -4z"/>
    <path d="M18 45 l4 -4 4 4 -4 4z"/>
    <path d="M64 45 l4 -4 4 4 -4 4z"/>
  </g>
  <!-- угловые розетки -->
  <g stroke="#0d3b6e" stroke-width="2" fill="#fffaf0">
    <circle cx="15" cy="15" r="10"/>
    <circle cx="75" cy="15" r="10"/>
    <circle cx="15" cy="75" r="10"/>
    <circle cx="75" cy="75" r="10"/>
  </g>
  <g fill="#c8102e">
    <circle cx="15" cy="15" r="4.5"/>
    <circle cx="75" cy="15" r="4.5"/>
    <circle cx="15" cy="75" r="4.5"/>
    <circle cx="75" cy="75" r="4.5"/>
  </g>
</svg>
